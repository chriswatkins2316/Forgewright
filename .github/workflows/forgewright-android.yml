name: Build Forgewright for Android

# Tap "Run workflow" on the Actions tab. When it finishes (about 20-30 minutes), the app is on the
# Releases page as "Forgewright (latest)". Open it on your phone and download the .apk.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Deckwright to Forge (applies forgewright.patch)
        run: |
          if git apply --check forgewright.patch; then
            git apply forgewright.patch
            echo "Forgewright changes applied:"; git status --short
          else
            echo "::error::forgewright.patch no longer fits Forge's latest code. Ask Claude to update the patch."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Maven 3.8.1 (the version Forge builds with)
        run: |
          curl -fsSL -o apache-maven-3.8.1-bin.tar.gz https://archive.apache.org/dist/maven/maven-3/3.8.1/binaries/apache-maven-3.8.1-bin.tar.gz
          tar xf apache-maven-3.8.1-bin.tar.gz
          echo "$PWD/apache-maven-3.8.1/bin" >> "$GITHUB_PATH"

      - name: Set up Android tools
        run: |
          JAVA_HOME=${JAVA_HOME_17_X64} ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "build-tools;35.0.0" "platform-tools" "platforms;android-35"

      - name: Install the Android Maven plugin and build Forge
        run: |
          mvn --version
          mkdir -p ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          cd ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          curl -fsSL -o android-maven-plugin-4.6.2.jar https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.jar
          curl -fsSL -o android-maven-plugin-4.6.2.pom https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.pom
          cd -
          mvn -B install -Dmaven.test.skip=true

      - name: Build the Forgewright app
        run: |
          command -v Xvfb >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B -P android-dev-build verify -e -Dandroid.sdk.path=$ANDROID_SDK_ROOT -Dandroid.buildToolsVersion=35.0.0 -Dmaven.test.skip=true
          ls -la forge-gui-android/target/*.apk

      - name: Publish it on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls forge-gui-android/target/*debugSigned*.apk 2>/dev/null | head -1)
          [ -n "$APK" ] || APK=$(ls -S forge-gui-android/target/*.apk | head -1)
          cp "$APK" Forgewright.apk
          gh release delete forgewright-latest --cleanup-tag -y 2>/dev/null || true
          gh release create forgewright-latest Forgewright.apk \
            --title "Forgewright (latest)" \
            --notes "Forgewright: Forge with Deckwright built in. Built $(date -u '+%Y-%m-%d %H:%M UTC') from commit ${GITHUB_SHA::7}. Based on Forge (https://github.com/Card-Forge/forge), GPL-3.0." \
            --latest
